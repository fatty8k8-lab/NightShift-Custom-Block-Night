plugins { id 'fabric-loom' version '1.10.5' }
version = '0.1.0'
group = 'nightshift'
if (System.getenv('NIGHTSHIFT_BUILD_DIR')) { layout.buildDirectory = file(System.getenv('NIGHTSHIFT_BUILD_DIR')) }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.5'
 mappings 'net.fabricmc:yarn:1.21.5+build.1:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.128.2+1.21.5'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
